# Makes the imported PVC show up as a bootable volume in
# Virtualization → Catalog → InstanceTypes.
# Only apply after DataVolume boot-volume-amd64 is Succeeded.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataSource
metadata:
  name: boot-volume-amd64
  namespace: default
  labels:
    instancetype.kubevirt.io/default-instancetype: u1.2xlarge
    instancetype.kubevirt.io/default-instancetype-kind: VirtualMachineClusterInstancetype
    instancetype.kubevirt.io/default-preference: rhel.9
    instancetype.kubevirt.io/default-preference-kind: VirtualMachineClusterPreference
    template.kubevirt.io/architecture: amd64
  annotations:
    openshift.io/display-name: CIM Discovery ISO 4.22
spec:
  source:
    pvc:
      name: boot-volume-amd64
      namespace: default
