# Allow VMs in bare-metal-hosts to clone DataVolumes from default (boot-volume-amd64).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cdi-clone-source
  namespace: default
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdi-clone-from-bare-metal-hosts
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: bare-metal-hosts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cdi-clone-source
