# Import the Discovery ISO once. Clone it for every VM after that.
#
# Prerequisites (service CA for CDI):
#   oc get cm assisted-image-service-ca -n default
# If missing:
#   oc get cm openshift-service-ca.crt -n default -o jsonpath='{.data.service-ca\.crt}' > /tmp/service-ca.crt
#   oc create configmap assisted-image-service-ca -n default \
#     --from-file=ca.crt=/tmp/service-ca.crt --from-file=tls.crt=/tmp/service-ca.crt
#
# URL must be in-cluster, not the public NLB hostname:
#   https://assisted-image-service.multicluster-engine.svc:8080/byapikey/<token>/4.22/x86_64/full.iso
#
#   oc process -f kubevirt-discovery-vms/boot-iso-datavolume.yaml \
#     NAME=boot-volume-amd64 \
#     ISO_URL='https://assisted-image-service.multicluster-engine.svc:8080/byapikey/.../full.iso' \
#     | oc apply -f -
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: boot-iso-datavolume
  annotations:
    description: One-time CDI import of the CIM Discovery ISO with the cluster service CA.
    openshift.io/display-name: CIM Discovery ISO DataVolume (import once)
objects:
  - apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    metadata:
      name: ${NAME}
      namespace: ${NAMESPACE}
      labels:
        instancetype.kubevirt.io/default-instancetype: u1.2xlarge
        instancetype.kubevirt.io/default-instancetype-kind: VirtualMachineClusterInstancetype
        instancetype.kubevirt.io/default-preference: ${PREFERENCE}
        instancetype.kubevirt.io/default-preference-kind: VirtualMachineClusterPreference
        template.kubevirt.io/architecture: amd64
      annotations:
        cdi.kubevirt.io/storage.bind.immediate.requested: "true"
        cdi.kubevirt.io/storage.usePopulator: "true"
        openshift.io/display-name: CIM Discovery ISO 4.22
    spec:
      source:
        http:
          url: ${ISO_URL}
          certConfigMap: assisted-image-service-ca
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: ${STORAGE_CLASS}
        volumeMode: Block
        resources:
          requests:
            storage: ${DISK_SIZE}
parameters:
  - name: NAME
    displayName: DataVolume / DataSource name
    value: boot-volume-amd64
  - name: NAMESPACE
    value: default
  - name: ISO_URL
    displayName: In-cluster HTTPS ISO URL (.svc:8080, not nlb-apps)
    required: true
  - name: DISK_SIZE
    displayName: PVC size (keep 100Gi so VM clones can use 100Gi)
    value: 100Gi
  - name: STORAGE_CLASS
    value: gp3-csi
  - name: PREFERENCE
    value: rhel.9
