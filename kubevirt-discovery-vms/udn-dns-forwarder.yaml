# DNS forwarder on the fake-bare-metal UDN.
# Spoke masters look up quay.io via cluster DNS 172.30.0.10 before CoreDNS exists.
# This pod owns 192.168.200.54 and forwards UDP/TCP 5353 to 8.8.8.8.
# AAAA queries get an empty NOERROR so kubelet does not try IPv6 to quay.io.
# Pair with a Service+Endpoints on the *spoke* (clusterIP 172.30.0.10 -> .54:5353).
apiVersion: v1
kind: ConfigMap
metadata:
  name: udn-dns-forwarder
  namespace: bare-metal-hosts
data:
  forwarder.py: |
    #!/usr/bin/env python3
    import socket
    import threading

    LISTEN = 5353
    UPSTREAM = ("8.8.8.8", 53)
    TYPE_AAAA = 28

    def qtype(data):
        i = 12
        while i < len(data):
            length = data[i]
            if length == 0:
                i += 1
                break
            if length & 0xC0 == 0xC0:
                i += 2
                break
            i += 1 + length
        if i + 2 > len(data):
            return None
        return int.from_bytes(data[i:i + 2], "big")

    def nodata(query):
        # NOERROR empty answer so kubelet falls back to A instead of IPv6.
        qend = 12
        while qend < len(query):
            length = query[qend]
            if length == 0:
                qend += 5
                break
            if length & 0xC0 == 0xC0:
                qend += 6
                break
            qend += 1 + length
        return query[:2] + b"\x81\x80" + b"\x00\x01\x00\x00\x00\x00\x00\x00" + query[12:qend]

    def udp():
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.bind(("0.0.0.0", LISTEN))
        while True:
            data, addr = sock.recvfrom(4096)
            try:
                if qtype(data) == TYPE_AAAA:
                    sock.sendto(nodata(data), addr)
                    continue
                up = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                up.settimeout(3)
                up.sendto(data, UPSTREAM)
                resp, _ = up.recvfrom(4096)
                sock.sendto(resp, addr)
            except OSError:
                pass
            finally:
                try:
                    up.close()
                except Exception:
                    pass

    def handle_tcp(client):
        try:
            hdr = client.recv(2)
            if len(hdr) < 2:
                return
            n = int.from_bytes(hdr, "big")
            q = b""
            while len(q) < n:
                chunk = client.recv(n - len(q))
                if not chunk:
                    return
                q += chunk
            if qtype(q) == TYPE_AAAA:
                r = nodata(q)
                client.sendall(len(r).to_bytes(2, "big") + r)
                return
            up = socket.create_connection(UPSTREAM, timeout=3)
            up.sendall(len(q).to_bytes(2, "big") + q)
            rh = up.recv(2)
            if len(rh) < 2:
                return
            rn = int.from_bytes(rh, "big")
            r = b""
            while len(r) < rn:
                chunk = up.recv(rn - len(r))
                if not chunk:
                    return
                r += chunk
            client.sendall(len(r).to_bytes(2, "big") + r)
        except OSError:
            pass
        finally:
            try:
                client.close()
            except OSError:
                pass

    def tcp():
        sock = socket.socket()
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        sock.bind(("0.0.0.0", LISTEN))
        sock.listen(32)
        while True:
            c, _ = sock.accept()
            threading.Thread(target=handle_tcp, args=(c,), daemon=True).start()

    threading.Thread(target=udp, daemon=True).start()
    tcp()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udn-dns-forwarder
  namespace: bare-metal-hosts
  labels:
    app: udn-dns-forwarder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udn-dns-forwarder
  template:
    metadata:
      labels:
        app: udn-dns-forwarder
      annotations:
        v1.multus-cni.io/default-network: |
          [{"name":"default","namespace":"openshift-ovn-kubernetes","ips":["192.168.200.54/24"]}]
    spec:
      containers:
        - name: forwarder
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/forwarder/forwarder.py"]
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /forwarder
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: udn-dns-forwarder
            defaultMode: 0555
