# Hub-side TCP proxy + AWS NLB for the 3-node spoke.
# AWS cannot target overlay IPs. FORWARD uses Ready node IPs (not keepalived
# .200/.201) because those VIPs are only reachable via OVN LBs, which can drop.
# Listen 8080/8443/16443 (non-root) -> NLB 80/443/6443.
apiVersion: v1
kind: ConfigMap
metadata:
  name: udn-tcp-proxy
  namespace: bare-metal-hosts
data:
  proxy.py: |
    #!/usr/bin/env python3
    import os
    import socket
    import threading

    def pipe(src, dst):
        try:
            while True:
                data = src.recv(65536)
                if not data:
                    break
                dst.sendall(data)
        except OSError:
            pass
        finally:
            for s in (src, dst):
                try:
                    s.shutdown(socket.SHUT_RDWR)
                except OSError:
                    pass

    def handle(client, backend, dest_port):
        try:
            remote = socket.create_connection((backend, dest_port), timeout=10)
        except OSError:
            client.close()
            return
        threading.Thread(target=pipe, args=(client, remote), daemon=True).start()
        pipe(remote, client)

    def serve(listen_port, backend, dest_port):
        sock = socket.socket()
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        sock.bind(("0.0.0.0", listen_port))
        sock.listen(128)
        while True:
            client, _ = sock.accept()
            threading.Thread(target=handle, args=(client, backend, dest_port), daemon=True).start()

    # listen:backend:dest  (comma-separated)
    mappings = os.environ.get("FORWARD", "").split(",")
    threads = []
    for part in mappings:
        part = part.strip()
        if not part:
            continue
        listen, backend, dest = part.split(":")
        t = threading.Thread(target=serve, args=(int(listen), backend, int(dest)), daemon=True)
        t.start()
        threads.append(t)
    if not threads:
        raise SystemExit("FORWARD is empty")
    threads[0].join()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udn-ingress-proxy
  namespace: bare-metal-hosts
  labels:
    app: udn-ingress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udn-ingress-proxy
  template:
    metadata:
      labels:
        app: udn-ingress-proxy
      annotations:
        k8s.ovn.org/open-default-ports: |
          [{"protocol":"tcp","port":8080},{"protocol":"tcp","port":8443},{"protocol":"tcp","port":16443}]
    spec:
      containers:
        - name: proxy
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/proxy/proxy.py"]
          env:
            - name: FORWARD
              value: "8080:192.168.200.11:80,8443:192.168.200.11:443,16443:192.168.200.10:6443"
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: api
              containerPort: 16443
          volumeMounts:
            - name: proxy
              mountPath: /proxy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: proxy
          configMap:
            name: udn-tcp-proxy
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: spoke-ingress
  namespace: bare-metal-hosts
  labels:
    app: udn-ingress-proxy
    spoke: bare-metal-aws
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: udn-ingress-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: api
      port: 6443
      targetPort: 16443
      protocol: TCP
