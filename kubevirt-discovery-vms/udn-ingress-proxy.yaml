# TCP proxy on the hub UDN: listen 8080/8443, forward to the spoke ingress VIP.
# A LoadBalancer Service in this namespace gets an AWS NLB. AWS cannot target
# 192.168.200.201 itself (that address exists only on the OVN overlay).
apiVersion: v1
kind: ConfigMap
metadata:
  name: udn-ingress-proxy
  namespace: bare-metal-hosts
data:
  proxy.py: |
    #!/usr/bin/env python3
    import socket
    import threading

    BACKEND = "192.168.200.201"

    def pipe(src, dst):
        try:
            while True:
                data = src.recv(65536)
                if not data:
                    break
                dst.sendall(data)
        except OSError:
            pass
        finally:
            for s in (src, dst):
                try:
                    s.shutdown(socket.SHUT_RDWR)
                except OSError:
                    pass

    def handle(client, dest_port):
        try:
            remote = socket.create_connection((BACKEND, dest_port), timeout=10)
        except OSError:
            client.close()
            return
        threading.Thread(target=pipe, args=(client, remote), daemon=True).start()
        pipe(remote, client)

    def serve(listen_port, dest_port):
        sock = socket.socket()
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        sock.bind(("0.0.0.0", listen_port))
        sock.listen(128)
        while True:
            client, _ = sock.accept()
            threading.Thread(target=handle, args=(client, dest_port), daemon=True).start()

    threading.Thread(target=serve, args=(8080, 80), daemon=True).start()
    serve(8443, 443)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udn-ingress-proxy
  namespace: bare-metal-hosts
  labels:
    app: udn-ingress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udn-ingress-proxy
  template:
    metadata:
      labels:
        app: udn-ingress-proxy
      annotations:
        k8s.ovn.org/open-default-ports: |
          [{"protocol":"tcp","port":8080},{"protocol":"tcp","port":8443}]
    spec:
      containers:
        - name: proxy
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/proxy/proxy.py"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: proxy
              mountPath: /proxy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: proxy
          configMap:
            name: udn-ingress-proxy
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: spoke-ingress
  namespace: bare-metal-hosts
  labels:
    app: udn-ingress-proxy
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: udn-ingress-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
