# OpenShift Virtualization catalog template for CIM discovery VMs on the L2 primary UDN.
#
# The Discovery ISO must be a CD-ROM. coreos-installer writes RHCOS to the empty
# virtio disk (/dev/vda). If the ISO is the only disk, install fails with
# "found busy partitions" on /dev/vda.
#
#   oc apply -n bare-metal-hosts -f kubevirt-discovery-vms/bare-metal-host-vm-template.yaml
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: bare-metal-host-vm
  labels:
    flavor.template.kubevirt.io/2xlarge: "true"
    os.template.kubevirt.io/rhel9: "true"
    template.kubevirt.io/architecture: amd64
    template.kubevirt.io/type: vm
    workload.template.kubevirt.io/server: "true"
  annotations:
    defaults.template.kubevirt.io/disk: harddrive
    description: >
      CIM discovery VM on the Layer-2 primary UDN. Boots the Discovery ISO as a
      CD-ROM and installs to an empty 100Gi disk. Do not use the ISO as the only disk.
    iconClass: icon-rhel
    name.os.template.kubevirt.io/rhel9: Red Hat Enterprise Linux 9
    openshift.io/display-name: CIM discovery host (L2 UDN)
    openshift.io/documentation-url: https://github.com/SimonDelord/ACM-Bare-metal-Management
    openshift.io/provider-display-name: ACM lab
    tags: kubevirt,virtualmachine,linux,rhel,cim,udn
    template.kubevirt.io/provider: ACM lab
    template.kubevirt.io/provider-support-level: Community
    template.openshift.io/bindable: "false"
message: |
  Created ${NAME} in the UDN project. It boots discovery-iso as CD-ROM and
  installs to ${DISK_SIZE} empty disk /dev/vda. Recreate ACM agents after this VM is up.
objects:
  - apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      name: ${NAME}
      labels:
        app: ${NAME}
        cim.example.com/role: discovery-vm
        vm.kubevirt.io/template: bare-metal-host-vm
    spec:
      runStrategy: Always
      instancetype:
        name: ${INSTANCETYPE}
      preference:
        kind: VirtualMachineClusterPreference
        name: ${PREFERENCE}
      dataVolumeTemplates:
        - metadata:
            name: ${NAME}-disk
          spec:
            source:
              blank: {}
            storage:
              accessModes:
                - ReadWriteOnce
              storageClassName: ${STORAGE_CLASS}
              volumeMode: Block
              resources:
                requests:
                  storage: ${DISK_SIZE}
        - metadata:
            name: ${NAME}-iso
          spec:
            sourceRef:
              kind: DataSource
              name: ${ISO_DATA_SOURCE}
              namespace: ${ISO_DATA_SOURCE_NAMESPACE}
            storage:
              accessModes:
                - ReadWriteOnce
              storageClassName: ${STORAGE_CLASS}
              volumeMode: Block
              resources:
                requests:
                  storage: ${ISO_SIZE}
      template:
        metadata:
          labels:
            kubevirt.io/domain: ${NAME}
        spec:
          architecture: amd64
          domain:
            devices:
              disks:
                - name: harddrive
                  disk:
                    bus: virtio
                  bootOrder: 2
                - name: iso
                  cdrom:
                    bus: sata
                  bootOrder: 1
              interfaces:
                - name: default
                  binding:
                    name: l2bridge
          networks:
            - name: default
              pod: {}
          volumes:
            - name: harddrive
              dataVolume:
                name: ${NAME}-disk
            - name: iso
              dataVolume:
                name: ${NAME}-iso
parameters:
  - name: NAME
    displayName: VirtualMachine name
    required: true
  - name: ISO_DATA_SOURCE
    displayName: Discovery ISO DataSource (CD-ROM clone)
    value: discovery-iso
  - name: ISO_DATA_SOURCE_NAMESPACE
    value: default
  - name: ISO_SIZE
    displayName: ISO clone size (must be >= DataSource PVC)
    value: 10Gi
  - name: DISK_SIZE
    displayName: Empty install disk size
    value: 100Gi
  - name: STORAGE_CLASS
    value: gp3-csi
  - name: INSTANCETYPE
    displayName: Instancetype (needs /dev/kvm)
    value: u1.2xlarge
  - name: PREFERENCE
    value: rhel.9
